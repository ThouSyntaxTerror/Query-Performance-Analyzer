<!doctype html>
<html><head><meta charset="utf-8"><title>ER diagram</title>
<style>body{margin:0;background:#fff;font-family:Arial,sans-serif}</style></head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="2400" height="1330" viewBox="0 0 2400 1330" font-size="14" text-anchor="middle"></svg>
<script>
const S = document.getElementById('d'), NS = 'http://www.w3.org/2000/svg';
const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; S.appendChild(e); return e; };
const lines = [], shapes = [];
const line = (a, b, label, lx, ly) => lines.push([a, b, label, lx, ly]);

// attrs: first is the primary key (underlined). ang: degrees, 0 = east, 90 = south. Odd items sit 70px further out when stagger is set.
const E = {
  STUDENT:     { x: 430,  y: 480, a: ['student_id','full_name','email','branch','cgpa','graduation_year','resume_text'], ang: [100,128,156,184,212,240,268], r: 235, stagger: true },
  APPLICATION: { x: 1130, y: 480, a: ['application_id','status','match_score','applied_at','created_by'], ang: [-150,-120,-90,-60,-30], r: 240, stagger: true },
  JOB:         { x: 1930, y: 480, a: ['job_id','title','description','min_cgpa','vacancies','package_lpa','deadline','status'], ang: [-155,-125,-95,-65,-35,-5,22,48], r: 245, stagger: true },
  COMPANY:     { x: 1930, y: 950, a: ['company_id','name','industry','location','website'], ang: [10,60,110,160,210], r: 235 },
  PLACEMENT:   { x: 1130, y: 950, a: ['placement_id','application_id','placed_on','package_lpa','created_by'], ang: [10,60,110,160,210], r: 235 },
};
const R = [
  { n: 'submits',    x: 780,  y: 480, a: 'STUDENT',     b: 'APPLICATION', ca: '1', cb: 'N' },
  { n: 'applies to', x: 1530, y: 480, a: 'JOB',         b: 'APPLICATION', ca: '1', cb: 'N' },
  { n: 'posts',      x: 1930, y: 715, a: 'COMPANY',     b: 'JOB',         ca: '1', cb: 'N' },
  { n: 'results in', x: 1130, y: 715, a: 'APPLICATION', b: 'PLACEMENT',   ca: '1', cb: '1' },
];

for (const [name, e] of Object.entries(E)) {
  shapes.push(() => { el('rect', { x: e.x - 90, y: e.y - 30, width: 180, height: 60, fill: '#e8e0c8', stroke: '#333', 'stroke-width': 2 }); el('text', { x: e.x, y: e.y + 6, 'font-weight': 'bold', 'font-size': 18 }, name); });
  e.a.forEach((t, i) => {
    const rr = e.r + (e.stagger && i % 2 ? 70 : 0);
    const ang = e.ang[i] * Math.PI / 180;
    const ax = e.x + rr * Math.cos(ang), ay = e.y + rr * Math.sin(ang);
    line([e.x, e.y], [ax, ay]);
    shapes.push(() => { el('ellipse', { cx: ax, cy: ay, rx: 74, ry: 25, fill: '#cfe0f8', stroke: '#333' }); el('text', { x: ax, y: ay + 5, 'text-decoration': i === 0 ? 'underline' : 'none' }, t); });
  });
}
for (const r of R) {
  const A = E[r.a], B = E[r.b];
  line([A.x, A.y], [r.x, r.y], r.ca, (A.x + r.x) / 2 + (A.x === r.x ? 14 : 0), (A.y + r.y) / 2 - (A.y === r.y ? 8 : 0));
  line([B.x, B.y], [r.x, r.y], r.cb, (B.x + r.x) / 2 + (B.x === r.x ? 14 : 0), (B.y + r.y) / 2 - (B.y === r.y ? 8 : 0));
  shapes.push(() => { el('polygon', { points: `${r.x},${r.y-40} ${r.x+78},${r.y} ${r.x},${r.y+40} ${r.x-78},${r.y}`, fill: '#c9f5ee', stroke: '#333', 'stroke-width': 2 }); el('text', { x: r.x, y: r.y + 5, 'font-weight': 'bold' }, r.n); });
}
el('text', { x: 1200, y: 50, 'font-size': 28, 'font-weight': 'bold' }, 'Placement Portal - ER Diagram');
el('text', { x: 1200, y: 82, 'font-size': 16, fill: '#555' }, '5 entities, each with 5 or more attributes');
el('text', { x: 1200, y: 1300, 'font-size': 15, fill: '#555' }, 'Also in the database: users (logins), skills with student_skills and job_skills (many-to-many), audit_log. A placement exists only for a selected application.');
lines.forEach(([a, b]) => el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#333', 'stroke-width': 1.5 }));
shapes.forEach((f) => f());
lines.forEach(([a, b, l, lx, ly]) => { if (l) el('text', { x: lx, y: ly, 'font-weight': 'bold', fill: '#b00', 'font-size': 20 }, l); });
</script></body></html>
